name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: app
        run: chmod +x ./gradlew

      - name: Run unit tests
        working-directory: app
        run: ./gradlew test

      - name: Build debug APK
        working-directory: app
        run: ./gradlew assembleDebug

      - name: Prepare release asset
        run: cp app/app/build/outputs/apk/debug/app-debug.apk app/SustainScore-debug.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: app/SustainScore-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
